services:
  conquest:
    build: .
    image: conquest:latest
    # Copy .env.example to .env and fill in the token and client ID.
    env_file: .env
    environment:
      # Overrides whatever .env says: inside the container the database
      # belongs on the volume, not in the working directory.
      CONQUEST_DB_PATH: /data/conquest.db
    volumes:
      - conquest-data:/data
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

  # Registers the slash commands, then exits. Run it after any command
  # definition changes:
  #   docker compose run --rm deploy-commands
  deploy-commands:
    build: .
    image: conquest:latest
    profiles: [tools]
    env_file: .env
    command: ["node", "build/src/scripts/deploy-commands.js"]
    restart: "no"

volumes:
  conquest-data:
